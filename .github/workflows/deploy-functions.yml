# Push lên master có đổi code Edge Function → chạy test → deploy lên Supabase.
# Cần secret của repo: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens; nên đặt hạn dài).
# Migration DB vẫn chạy tay (npm run db:push) để không tự đổi schema production.
name: Deploy Edge Functions

on:
  push:
    branches: [master]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

env:
  PROJECT_REF: rbodkthyuiyfotewgxku

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      copilot: ${{ steps.filter.outputs.copilot }}
      mcp: ${{ steps.filter.outputs.mcp }}
      embed_helpdesk: ${{ steps.filter.outputs.embed_helpdesk }}
      jira_sync: ${{ steps.filter.outputs.jira_sync }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Mọi function đều phụ thuộc _shared/**: liệt kê từng file dễ sót
            # (file mới không nằm trong bộ lọc thì sửa riêng nó sẽ không
            # deploy lại function). Đổi bất kỳ file _shared nào → deploy lại cả 4
            # function cho chắc; thừa một lần deploy rẻ hơn thiếu một lần.
            mcp:
              - 'supabase/functions/mcp/**'
              - 'supabase/functions/copilot/**'
              - 'supabase/functions/_shared/**'
            copilot:
              - 'supabase/functions/copilot/**'
              - 'supabase/functions/_shared/**'
            embed_helpdesk:
              - 'supabase/functions/embed-helpdesk/**'
              - 'supabase/functions/_shared/**'
            jira_sync:
              - 'supabase/functions/jira-sync/**'
              - 'supabase/functions/_shared/**'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test

  deploy-copilot:
    needs: [changes, test]
    if: needs.changes.outputs.copilot == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase functions deploy copilot --no-verify-jwt --use-api --project-ref "$PROJECT_REF"

  deploy-embed-helpdesk:
    needs: [changes, test]
    if: needs.changes.outputs.embed_helpdesk == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase functions deploy embed-helpdesk --no-verify-jwt --use-api --project-ref "$PROJECT_REF"

  deploy-jira-sync:
    needs: [changes, test]
    if: needs.changes.outputs.jira_sync == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase functions deploy jira-sync --no-verify-jwt --use-api --project-ref "$PROJECT_REF"

  deploy-mcp:
    needs: [changes, test]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase functions deploy mcp --no-verify-jwt --use-api --project-ref "$PROJECT_REF"
